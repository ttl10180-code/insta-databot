name: 평일 · 장바구니 물가

# KAMIS 일별 소매가는 오후에 갱신된다. 평일 17:10 KST.
on:
  schedule:
    - cron: '10 8 * * 1-5'        # 08:10 UTC = 17:10 KST, 월~금
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'price'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
