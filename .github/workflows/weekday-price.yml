name: 평일 · 장바구니 물가 (보류)

# ── 보류 중 (2026-09-16) ─────────────────────────────────────────
# 공공데이터포털 '한국농수산식품유통공사_일별 도,소매 가격정보' 가
# 조건을 전부 떼고 불러도 totalCount 0 으로 빈 응답만 준다.
#   {"response":{"body":{"items":{"item":[]},"totalCount":0},
#                "header":{"resultCode":"0","resultMsg":"정상"}}}
# 인증·권한·파라미터는 모두 정상이므로 데이터 자체가 안 내려오는 것.
# 데이터를 제대로 받게 되면(KAMIS 직접 연동 또는 운영계정) 아래
# schedule 주석을 풀면 된다. 그때까지는 수동 실행만 남겨 둔다.
on:
  # schedule:
  #   - cron: '10 8 * * 1-5'      # 08:10 UTC = 17:10 KST, 월~금
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
      actions: read           # _publish 가 '오늘 이미 올렸나' 를 실행 기록으로 판단한다
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'price'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
