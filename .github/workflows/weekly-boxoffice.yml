name: 주간 · 주말 박스오피스

# 주말 집계는 월요일 오전에 확정된다. 월요일 11:40 KST.
on:
  schedule:
    - cron: '40 2 * * 1'           # 11:40 KST 월
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '10 4 * * 1'           # 13:10 KST 월 — 재시도
    - cron: '40 5 * * 1'           # 14:40 KST 월 — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'boxoffice_weekly'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
