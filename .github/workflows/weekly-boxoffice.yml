name: 주간 · 주말 박스오피스

# 주말 집계는 월요일 오전에 확정된다. 월요일 11:40 KST.
on:
  schedule:
    - cron: '40 2 * * 1'          # 02:40 UTC 월 = 11:40 KST 월
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'boxoffice_weekly'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
