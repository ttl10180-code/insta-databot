name: 디자인 미리보기 (샘플 데이터)

# API 키 없이도 카드 디자인을 확인할 수 있다.
# 실행 후 Artifacts 에서 이미지를 내려받아 확인하세요.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'templates/**'
      - 'src/**'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji
          fc-cache -f
      - run: python -m playwright install --with-deps chromium
      - run: python -m src.main render weather air realestate oil --sample
      - uses: actions/upload-artifact@v4
        with:
          name: preview-cards
          path: out/
