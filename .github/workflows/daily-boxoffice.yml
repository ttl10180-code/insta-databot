name: 매일 · 박스오피스

# KOBIS 는 전날 집계를 아침에 확정한다. 09:20 KST 에 돌린다.
on:
  schedule:
    - cron: '20 0 * * *'          # 00:20 UTC = 09:20 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'boxoffice'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
