name: 매일 · 박스오피스

# KOBIS 는 전날 집계를 아침에 확정한다. 09:20 KST 에 돌린다.
on:
  schedule:
    - cron: '20 0 * * *'           # 09:20 KST
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '35 1 * * *'           # 10:35 KST — 재시도
    - cron: '5 3 * * *'            # 12:05 KST — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'boxoffice'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
