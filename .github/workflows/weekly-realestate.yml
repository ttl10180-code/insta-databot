name: 매주 월요일 · 아파트 실거래

on:
  schedule:
    # 월요일 09:00 KST = 일요일 00:00 UTC
    - cron: '7 0 * * 0'            # 09:07 KST 일
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '37 1 * * 0'           # 10:37 KST 일 — 재시도
    - cron: '7 3 * * 0'            # 12:07 KST 일 — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'realestate'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
