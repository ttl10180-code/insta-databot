name: 매일 아침 · 날씨 + 대기질

on:
  schedule:
    # 07:30 KST (UTC+9) = 22:30 UTC 전날
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'weather air'
      carousel: true
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
