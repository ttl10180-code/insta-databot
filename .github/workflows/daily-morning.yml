name: 매일 아침 · 날씨 + 대기질 + 생활지수

on:
  schedule:
    # 07:27 KST (UTC+9) = 22:27 UTC 전날
    # 정각·30분은 깃허브 예약 실행이 가장 많이 밀리는 시각이라 일부러 비켜 둔다.
    - cron: '27 22 * * *'          # 07:27 KST
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '43 23 * * *'          # 08:43 KST — 재시도
    - cron: '13 1 * * *'           # 10:13 KST — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'weather air lifeindex'
      carousel: true
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
