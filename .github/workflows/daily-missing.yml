name: 매일 · 실종자 찾기

# 실종경보는 수시로 갱신된다. 사람이 가장 많이 보는 저녁 시간에 한 번 올린다.
on:
  schedule:
    - cron: '0 10 * * *'          # 10:00 UTC = 19:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'missing'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
