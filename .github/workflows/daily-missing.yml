name: 매일 · 실종자 찾기

# 실종경보는 수시로 갱신된다. 사람이 가장 많이 보는 저녁 시간에 한 번 올린다.
on:
  schedule:
    - cron: '7 10 * * *'           # 19:07 KST
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '23 11 * * *'          # 20:23 KST — 재시도
    - cron: '53 12 * * *'          # 21:53 KST — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'missing'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
