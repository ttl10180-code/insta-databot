name: 주간 · 아파트 청약 일정

# 한 주 시작에 이번 2주 청약 일정을 정리해 올린다. 월요일 08:10 KST.
on:
  schedule:
    - cron: '10 23 * * 0'          # 08:10 KST 월
    # 한 번 실패해도 그날 안에 다시 시도한다. 이미 성공한 날은
    # _publish.yml 의 '오늘 이미 올렸는지 확인' 이 조용히 건너뛴다.
    - cron: '40 0 * * 1'           # 09:40 KST 월 — 재시도
    - cron: '10 2 * * 1'           # 11:10 KST 월 — 재시도
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'apply'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
