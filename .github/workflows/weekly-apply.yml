name: 주간 · 아파트 청약 일정

# 한 주 시작에 이번 2주 청약 일정을 정리해 올린다. 월요일 08:10 KST.
on:
  schedule:
    - cron: '10 23 * * 0'         # 23:10 UTC 일 = 08:10 KST 월
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'apply'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
