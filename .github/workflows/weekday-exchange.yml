name: 평일 · 환율

# 매매기준율은 영업일 오전에 고시된다. 평일 11:10 KST.
on:
  schedule:
    - cron: '10 2 * * 1-5'        # 02:10 UTC = 11:10 KST, 월~금
  workflow_dispatch:
    inputs:
      dry_run:
        description: '게시 없이 이미지만 생성'
        type: boolean
        default: false

jobs:
  run:
    permissions:
      contents: write
    uses: ./.github/workflows/_publish.yml
    with:
      cards: 'exchange'
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
