{% extends layout | default("_layout.html") %}
{% block hero %}
    <div class="hero__main hero__main--wide">
      <div class="faces">
{% for r in d['items'] %}        <figure class="face">
          {% if r.photo %}<img class="face__img" src="{{ r.photo }}" alt="">
          {% else %}<span class="face__img face__img--none">사진 없음</span>{% endif %}
          <figcaption class="face__cap">
            <b>{{ r.name }}</b>
            <span>{{ r.age }} · {{ r.sex }}</span>
            <span>{{ r.day }} · {{ r.place }}</span>
          </figcaption>
        </figure>
{% endfor %}      </div>
    </div>
{% endblock %}
{% block body %}
    <div class="chips">
      <div class="chip"><span class="chip__label">제보 전화</span>
        <span class="chip__value">182<small>국번없이 · 24시간</small></span></div>
      <div class="chip"><span class="chip__label">경보 발령</span>
        <span class="chip__value">{{ d.count }}<small>명</small></span></div>
      <div class="chip"><span class="chip__label">5년 이상</span>
        <span class="chip__value">{{ d.long_cases }}<small>명</small></span></div>
    </div>
    <p class="note">확실하지 않아도 괜찮습니다. 비슷한 분을 보셨다면 182로 알려주세요.</p>
{% endblock %}
