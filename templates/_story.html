<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="story.css">
</head>
<body class="story">
<div class="card {{ theme }}">
{% if bg %}  <div class="bgart" style="--bg-art: url('../assets/bg/{{ bg }}.jpg')"></div>{% endif %}

  <div class="st__safe">
    <header class="hd">
      <span class="hd__eyebrow">{{ eyebrow }}</span>
      <span class="hd__date">{{ date_label }}</span>
    </header>

    <div class="ttl"><h1 data-autofit="76,44">{{ title }}</h1></div>

    <section class="hero">
{% block hero %}{% endblock %}
{% include "_mascot.html" %}
    </section>

    <main class="bd">
{% block body %}{% endblock %}
    </main>

    <footer class="ft">
      <span>출처 <b>{{ source }}</b></span>
      <span class="ft__handle">{{ handle }}</span>
    </footer>
  </div>

</div>

<script>
Promise.all([
  document.fonts.ready,
  ...Array.from(document.images).map(function (im) {
    return im.complete ? Promise.resolve() : new Promise(function (r) { im.onload = im.onerror = r; });
  }),
]).then(function () {
  document.querySelectorAll('[data-autofit]').forEach(function (el) {
    var p = el.dataset.autofit.split(','), size = parseFloat(p[0]), min = parseFloat(p[1]), n = 0;
    var box = el.parentElement;
    el.style.fontSize = size + 'px';
    while (el.offsetHeight > box.clientHeight + 1 && size > min && n++ < 140) {
      size -= 1; el.style.fontSize = size + 'px';
    }
  });
  var main = document.querySelector('.hero__main');
  var row  = document.querySelector('.hero__row');
  var num  = document.querySelector('.hero__num');
  if (main && row && num) {
    var fs = 260, guard = 0;
    num.style.fontSize = fs + 'px';
    while (row.scrollWidth > main.clientWidth && fs > 110 && guard++ < 220) {
      fs -= 4; num.style.fontSize = fs + 'px';
    }
  }
  var bd = document.querySelector('.bd');
  var need = 0;
  if (bd && bd.children.length) {
    var kids = bd.children;
    need = kids[kids.length - 1].getBoundingClientRect().bottom
         - kids[0].getBoundingClientRect().top;
  }
  if (bd && need > bd.clientHeight + 1) {
    var k = Math.max(0.7, bd.clientHeight / need);
    bd.style.transformOrigin = 'top center';
    bd.style.transform = 'scale(' + k + ')';
  }
  document.documentElement.setAttribute('data-render-ready', '1');
});
</script>
</body>
</html>
